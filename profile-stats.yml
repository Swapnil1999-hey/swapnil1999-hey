name: Update Profile SVGs

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_profile_svgs.py"
      - "octocat.png"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_profile_svgs.py --user "${{ github.repository_owner }}" --out .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg activity-graph.svg highlights.svg
          git diff --staged --quiet || git commit -m "chore: update profile SVGs"
          git push
